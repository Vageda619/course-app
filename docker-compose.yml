services:
  db:
    image: postgres:16-alpine
    container_name: course_db
    environment:
      POSTGRES_DB: course_db
      POSTGRES_USER: course_user
      POSTGRES_PASSWORD: course_pass
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U course_user -d course_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - appnet

  web-service:
    build: ./web-service
    container_name: course_web_service
    networks:
      - appnet

  backend:
    build: ./backend
    container_name: course_backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: course_db
      DB_USER: course_user
      DB_PASSWORD: course_pass
      WEB_SERVICE_URL: http://web-service:4000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      web-service:
        condition: service_started
    networks:
      - appnet

  frontend:
    build: ./frontend
    container_name: course_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - appnet

volumes:
  db_data:

networks:
  appnet:
    driver: bridge
